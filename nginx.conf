server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine ships gzip disabled by default — the JS bundle is ~3.4x
    # larger than necessary (265KB raw vs. 78KB gzipped) without this.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # A government reporting app with login/JWT/admin flows shouldn't ship
    # with zero security headers. Skipping HSTS (depends on where TLS
    # actually terminates, which this container doesn't know) and CSP
    # (needs careful tuning against the app's real script sources to avoid
    # breaking it) — out of scope for this pass.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Reverse-proxy API calls to nccrd-api over the internal Docker network
    # (service name, not localhost — this container isn't nccrd-api). Means
    # the browser only ever talks to this one origin/port — no second port
    # needs to be reachable from outside, and no CORS is needed since
    # everything is same-origin from the browser's point of view. The /api/
    # prefix is stripped by the trailing slash on proxy_pass, since nccrd-api
    # itself mounts routes at the root (/auth, /submission, etc, with no
    # /api prefix of its own).
    location /api/ {
        proxy_pass http://nccrd-api:2022/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashes every built JS/CSS filename (e.g. index-Ab12Cd.js) —
    # a changed file always gets a new name, so these are safe to cache
    # aggressively and indefinitely; the browser will only ever re-fetch one
    # if its filename (i.e. its content) actually changed.
    #
    # NOTE: add_header in a location block does NOT inherit the server-level
    # add_headers above (nginx's inheritance is all-or-nothing per context —
    # a location defining its own add_header replaces the parent's set
    # entirely rather than merging), so the three security headers are
    # repeated here explicitly.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    # index.html is the opposite case: it's what names the CURRENT build's
    # hashed asset files, so it must never be cached — a stale cached
    # index.html would keep pointing at an old (possibly missing) build
    # forever, showing an out-of-date app with no way to tell short of a
    # hard refresh. SPA client-side routing also falls back here for any
    # path that isn't a real static asset above.
    #
    # Same add_header-doesn't-inherit note as above applies here too.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
